pertise","Evidence based medicine","Epistemology"],"answer":"Critical appraisal","explanation":"Critical appraisal adalah penilaian sistematis terhadap validity, importance, dan applicability suatu bukti penelitian.","distractors":["Critical thinking: opsi ini menggambarkan kemampuan umum untuk menalar, menganalisis, mengevaluasi, dan memecahkan masalah, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Clinical expertise: opsi ini menggambarkan keahlian klinis yang diperoleh dari pengalaman dan pelatihan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Evidence based medicine: opsi ini menggambarkan penggabungan bukti terbaik, keahlian klinis, serta nilai dan preferensi pasien, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Epistemology: opsi ini menggambarkan kajian tentang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Critical appraisal","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":55,"stem":"Proses menghafal nomer tlp masuk kategori apa","options":["Short-term memory","Long-term memory","Semantic memory","Procedural memory","Episodic memory"],"answer":"Short-term memory","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Long-term memory: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Semantic memory: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Procedural memory: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Episodic memory: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Memori","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":56,"stem":". Apakah sejarah munculnya EBM?","options":["Moving practice from personal experience toward evidence from scientific research","Replacing all clinical expertise with guidelines","Using only laboratory experiments in clinical care","Avoiding research because evidence changes","Using expert opinion as the sole basis of care"],"answer":"Moving practice from personal experience toward evidence from scientific research","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Replacing all clinical expertise with guidelines: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Using only laboratory experiments in clinical care: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Avoiding research because evidence changes: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Using expert opinion as the sole basis of care: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":57,"stem":"Tongkat Nabi musa dilempar dan berubah menjadi ular","options":["Empiris dan suprarasional","Empiris dan rasional","Logis dan rasional","Logis dan empiris","Rasional dan pragmatis"],"answer":"Empiris dan suprarasional","explanation":"Sumber memposisikan mukjizat tersebut sebagai peristiwa nyata dalam narasi sekaligus melampaui mekanisme alam biasa.","distractors":["Empiris dan rasional: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Logis dan rasional: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Logis dan empiris: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Rasional dan pragmatis: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Islamic studies • Epistemology","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":58,"stem":"Tahun kejayaan ilmu pengetahuan islam yg tidak ditulis pada buku ciptaan ilmu pengetahuan barat adalah kapan","options":["800–1000 CE","500–700 CE","1000–1200 CE","1300–1500 CE","1500–1700 CE"],"answer":"800–1000 CE","explanation":"Rentang 800–1000 M sering digunakan dalam materi sumber untuk menandai periode kejayaan ilmu pengetahuan Islam.","distractors":["500–700 CE: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","1000–1200 CE: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","1300–1500 CE: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","1500–1700 CE: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Islamic history","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":59,"stem":"Seorang tokoh yang mencetuskan andragogy sebagai ilmu dan seni yang membantu orang dewasa belajar?","options":["Malcolm Knowles","Jean Piaget","Abraham Maslow","Plato","Aristotle"],"answer":"Malcolm Knowles","explanation":"Malcolm Knowles dikenal luas sebagai tokoh utama pengembangan konsep andragogi modern.","distractors":["Jean Piaget: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Abraham Maslow: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Plato: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Aristotle: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Andragogi","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":60,"stem":"Apa yang termasuk komponen motivasi diri","options":["Intrinsic motivation","Extrinsic motivation","Task value","Self-efficacy","Goal orientation"],"answer":"Intrinsic motivation","explanation":"Motivasi intrinsik berasal dari dorongan dan ketertarikan dari dalam diri.","distractors":["Extrinsic motivation: opsi ini menggambarkan dorongan karena faktor luar seperti hadiah atau hukuman, bukan dorongan yang berasal dari dalam diri.","Task value: opsi ini menggambarkan persepsi tentang pentingnya, menariknya, dan bergunanya materi/tugas, bukan dorongan yang berasal dari dalam diri.","Self-efficacy: opsi ini menggambarkan keyakinan bahwa diri mampu melakukan suatu tugas, bukan dorongan yang berasal dari dalam diri.","Goal orientation: opsi ini menggambarkan orientasi terhadap tujuan pencapaian dalam belajar, bukan dorongan yang berasal dari dalam diri."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Motivasi","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":61,"stem":"proses proses selft directed learning A.mediganosis kebuthan belajar B.Mendiagnosis hambatan belajar C.memformulasi keadaan","options":["Visual","Auditory","Kinesthetic","Analytical","Global"],"answer":"Visual","explanation":"Gaya visual lebih sesuai dengan dukungan berupa diagram, gambar, atau representasi visual.","distractors":["Auditory: opsi ini menggambarkan pemrosesan informasi melalui pendengaran dan pengulangan lisan, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Kinesthetic: opsi ini menggambarkan belajar melalui keterlibatan fisik dan praktik, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Analytical: opsi ini menggambarkan kecenderungan mengolah informasi secara bagian demi bagian, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Global: opsi ini menggambarkan kecenderungan melihat informasi sebagai gambaran besar, bukan pemrosesan informasi yang banyak dibantu gambar/diagram."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Gaya belajar","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":62,"stem":"Kelebihan dari pbl antara lain","options":["Memperkuat retensi dan pemahaman jangka panjang","Mengurangi kebutuhan berpikir kritis","Selalu membutuhkan waktu paling singkat","Menghilangkan kebutuhan kolaborasi","Menurunkan keterlibatan mahasiswa"],"answer":"Memperkuat retensi dan pemahaman jangka panjang","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Mengurangi kebutuhan berpikir kritis: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Selalu membutuhkan waktu paling singkat: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Menghilangkan kebutuhan kolaborasi: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Menurunkan keterlibatan mahasiswa: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • PBL","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":63,"stem":"Peserta didik telah berusaha menjalani proses belajar, dipandang telah belajar apabila hasilnya memuaskan. Belajar sebagai apa pernyataan tersebut? Belajar sebagai doa Belajar sebagai tujuan hidup Belajar sebagai proses Belajar sebagai perantara Belajar sebagai hasil Dari pernyataan berikut ini yang merupakan keuntungan dari pembelajaran berbasis masalah?","options":["Memory","Acquisition","Consolidation","Retrieval","Metacognition"],"answer":"Memory","explanation":"Memori adalah proses mental untuk encoding, penyimpanan, dan pemanggilan kembali informasi.","distractors":["Acquisition: opsi ini menggambarkan masuknya informasi ke sistem memori, bukan proses encoding, penyimpanan, dan pemanggilan kembali informasi.","Consolidation: opsi ini menggambarkan mengintegrasikan informasi baru dengan pengetahuan yang sudah tersimpan, bukan proses encoding, penyimpanan, dan pemanggilan kembali informasi.","Retrieval: opsi ini menggambarkan pemanggilan kembali informasi yang telah disimpan, bukan proses encoding, penyimpanan, dan pemanggilan kembali informasi.","Metacognition: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Memori","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":64,"stem":"Ada beberapa cara dalam mengubah short term memory menjadi long term memory. Salah satunya dengan membuat jembatan keledai . Transfer apakah itu?","options":["Metamemory","Consolidation","Rehearsal","Acquisition","Retrieval"],"answer":"Metamemory","explanation":"Metamemory adalah pengetahuan/kesadaran seseorang mengenai cara kerja dan strategi memorinya.","distractors":["Consolidation: opsi ini menggambarkan mengintegrasikan informasi baru dengan pengetahuan yang sudah tersimpan, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori.","Rehearsal: opsi ini menggambarkan pengulangan informasi untuk mempertahankan atau memperkuat ingatan, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori.","Acquisition: opsi ini menggambarkan masuknya informasi ke sistem memori, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori.","Retrieval: opsi ini menggambarkan pemanggilan kembali informasi yang telah disimpan, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Memori","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":65,"stem":"Hal dibawah ini yang berkaitan dengan NNT?","options":["Importance","Validity","Applicability","Study design","Blinding"],"answer":"Importance","explanation":"NNT berkaitan dengan besarnya dampak klinis suatu intervensi; NNT lebih kecil berarti lebih sedikit pasien perlu diterapi untuk memperoleh satu manfaat tambahan.","distractors":["Validity: opsi ini menggambarkan kesahihan metodologis penelitian, bukan kemaknaan atau besarnya dampak hasil penelitian.","Applicability: opsi ini menggambarkan kemampuan menerapkan hasil penelitian pada pasien/konteks tertentu, bukan kemaknaan atau besarnya dampak hasil penelitian.","Study design: opsi ini menggambarkan rancangan penelitian, bukan kemaknaan atau besarnya dampak hasil penelitian.","Blinding: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Effect size","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Axon","Kumpulan1"],"isCase":false},{"id":66,"stem":"Gaya belajar mengacu pada? A.pengajar yang sesuai dengan gaya belajar B.lingkungan belajar yang paling sesuai C.cara belajar yang di sukai siswa D.materi pelajaran yang disukai","options":["Visual","Auditory","Kinesthetic","Analytical","Global"],"answer":"Visual","explanation":"Gaya visual lebih sesuai dengan dukungan berupa diagram, gambar, atau representasi visual.","distractors":["Auditory: opsi ini menggambarkan pemrosesan informasi melalui pendengaran dan pengulangan lisan, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Kinesthetic: opsi ini menggambarkan belajar melalui keterlibatan fisik dan praktik, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Analytical: opsi ini menggambarkan kecenderungan mengolah informasi secara bagian demi bagian, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Global: opsi ini menggambarkan kecenderungan melihat informasi sebagai gambaran besar, bukan pemrosesan informasi yang banyak dibantu gambar/diagram."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Gaya belajar","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Kumpulan1"],"isCase":false},{"id":67,"stem":"Bagaimanakah karakteristik pembelajaran model konvensional?","options":["Information gathering with teacher dependence","Self-directed, problem-centered learning","Integrated interdisciplinary learning","Community-based problem solving","Reflective self-assessment"],"answer":"Information gathering with teacher dependence","explanation":"Pembelajaran tradisional/konvensional dalam materi sumber menekankan ketergantungan pada pengajar dan pengumpulan informasi.","distractors":["Self-directed, problem-centered learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Integrated interdisciplinary learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Community-based problem solving: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Reflective self-assessment: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Traditional model","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Kumpulan1","Ujian"],"isCase":false},{"id":68,"stem":"Dalam jurnal ilmiah, dokter biasanya menggunakan kata kunci efficacy. Termasuk metode apakah Efficacy itu?","options":["Problem or patient","Intervention","Comparison","Outcome","Study design"],"answer":"Outcome","explanation":"O pada PICO adalah luaran yang diukur, misalnya efficacy.","distractors":["Problem or patient: opsi ini menggambarkan masalah/pasien atau populasi dalam PICO, bukan luaran yang diukur.","Intervention: opsi ini menggambarkan intervensi yang sedang dinilai, bukan luaran yang diukur.","Comparison: opsi ini menggambarkan pembanding seperti placebo atau terapi standar, bukan luaran yang diukur.","Study design: opsi ini menggambarkan rancangan penelitian, bukan luaran yang diukur."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • PICO","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Kumpulan1"],"isCase":false},{"id":69,"stem":"Urutan level of evidence dari tingkat tinggi ke rendah yaitu","options":["Randomized controlled trial","Cohort study","Case-control study","Case series","Expert opinion"],"answer":"Randomized controlled trial","explanation":"RCT termasuk desain eksperimental dengan randomisasi sehingga kuat untuk menilai efek intervensi; di antara pilihan pada soal sumber, ini berada paling tinggi.","distractors":["Cohort study: opsi ini menggambarkan studi observasional yang mengikuti kelompok berdasarkan paparan, bukan uji intervensi dengan randomisasi.","Case-control study: opsi ini menggambarkan studi observasional yang membandingkan kelompok berdasarkan kejadian/outcome, bukan uji intervensi dengan randomisasi.","Case series: opsi ini menggambarkan deskripsi serangkaian kasus tanpa kelompok pembanding formal, bukan uji intervensi dengan randomisasi.","Expert opinion: opsi ini menggambarkan pendapat ahli tanpa dasar desain penelitian komparatif, bukan uji intervensi dengan randomisasi."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Level of evidence","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Kumpulan1"],"isCase":false},{"id":70,"stem":"Berikut merupakan sarana berfikir ilmiah, yaitu.. A.Matematika,Statistika,Bahasa,Logika","options":["Bahasa, logika, matematika, dan statistika","Bahasa dan logika","Matematika dan statistika","Fenomenologi dan empirisme","Rasionalisme dan pragmatisme"],"answer":"Bahasa, logika, matematika, dan statistika","explanation":"Keempatnya disebut sebagai sarana berpikir ilmiah dalam materi sumber.","distractors":["Bahasa dan logika: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Matematika dan statistika: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Fenomenologi dan empirisme: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Rasionalisme dan pragmatisme: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Scientific thinking","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Kumpulan1"],"isCase":false},{"id":71,"stem":"Ada seorang dosen meminta tolong kepada mahasiswa tersebut untuk ikut dalam penelitiannya, dosen tersebut menawarkan jika mau dijadikan uji coba maka akan diberikan privilege berupa menggunakan laboratorium tersebut sesuka hati. apakah dokumen yang diperlukan dosen tersebut dalam melakukan penelitian tersebut?","options":["Respect autonomy and obtain informed consent from the competent patient","Obtain consent only from the hospital director","Assume consent is unnecessary in all research","Ask unrelated staff to sign in place of the patient","Use treatment as a substitute for consent"],"answer":"Respect autonomy and obtain informed consent from the competent patient","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Obtain consent only from the hospital director: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Assume consent is unnecessary in all research: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Ask unrelated staff to sign in place of the patient: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Use treatment as a substitute for consent: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Clinical ethics • Informed consent","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Kumpulan1"],"isCase":false},{"id":72,"stem":"Fahri adalah seorang mahasiswa.sepulang kuliah dia selalu merenung dan mengulangi lagi dalam pelajaran saat di kuliah agar dia semakin paham.pemahaman ini disebut... a.afektif b.kognitive c.psikomotor d.behavioristik","options":["Behavioristic","Cognitive","Humanistic","Social learning","Constructivist"],"answer":"Cognitive","explanation":"Ranah kognitif berkaitan dengan proses berpikir.","distractors":["Behavioristic: opsi ini menggambarkan pandangan belajar sebagai perubahan perilaku yang dapat diamati, bukan pandangan belajar sebagai proses mental.","Humanistic: opsi ini menggambarkan pandangan belajar yang menekankan manusia dan aktualisasi diri, bukan pandangan belajar sebagai proses mental.","Social learning: opsi ini menggambarkan belajar melalui interaksi/pengamatan sosial, bukan pandangan belajar sebagai proses mental.","Constructivist: opsi ini menggambarkan belajar melalui konstruksi pengetahuan oleh peserta didik, bukan pandangan belajar sebagai proses mental."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning theory","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Kumpulan1"],"isCase":false},{"id":73,"stem":"Perhatikan pernyataan berikut. Manakah yang merupakan entimem?","options":["Slamet is a smoker","Slamet is at risk of respiratory problems","Slamet is at risk because he is a smoker","All smokers are at risk of respiratory problems","Slamet smokes and has respiratory disease"],"answer":"Slamet is at risk because he is a smoker","explanation":"Entimem adalah argumen yang salah satu premisnya tidak dinyatakan secara eksplisit.","distractors":["Slamet is a smoker: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Slamet is at risk of respiratory problems: opsi ini menggambarkan hasil/kesimpulan yang diturunkan dari premis, bukan entimem dengan salah satu premis yang tidak diucapkan secara eksplisit.","All smokers are at risk of respiratory problems: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Slamet smokes and has respiratory disease: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Logic","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":74,"stem":"Suatu pengetahuan yang memenuhi kriteria : 1) mempunyai objek kajian, 2) mempunyai metode pendekatan, dan","options":["Ilmu","Pengetahuan","Epistemologi","Ontologi","Aksiologi"],"answer":"Ilmu","explanation":"Ilmu dalam materi sumber memiliki objek kajian, metode pendekatan, dan sifat universal/dapat diakui secara umum.","distractors":["Pengetahuan: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Epistemologi: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Ontologi: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Aksiologi: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Philosophy of science","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":75,"stem":"bersifat universal (mendapat pengakuan secara umum), disebut …","options":["Humility before the teacher and recognition of the teacher’s greater knowledge","A student does not need a teacher","A student must demand every piece of knowledge","A student should contradict the teacher","A student should claim equal knowledge"],"answer":"Humility before the teacher and recognition of the teacher’s greater knowledge","explanation":"Kisah Musa–Khidir menggambarkan adab murid berupa kerendahan hati dan pengakuan atas keterbatasan pengetahuan diri.","distractors":["A student does not need a teacher: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student must demand every piece of knowledge: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student should contradict the teacher: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student should claim equal knowledge: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Islamic studies • Adab","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":76,"stem":"Terdapat 4 fase dalam memperoleh keterampilan praktik klinik. Salah satu fase tersebut yaitu belajar praktek sederhana dan tugas-tugas rutin. Apakah nama fase tersebut?","options":["Retrieval","Acquisition","Consolidation","Rehearsal","Metamemory"],"answer":"Retrieval","explanation":"Retrieval adalah pemanggilan kembali informasi yang telah disimpan.","distractors":["Acquisition: opsi ini menggambarkan masuknya informasi ke sistem memori, bukan pemanggilan kembali informasi yang telah disimpan.","Consolidation: opsi ini menggambarkan mengintegrasikan informasi baru dengan pengetahuan yang sudah tersimpan, bukan pemanggilan kembali informasi yang telah disimpan.","Rehearsal: opsi ini menggambarkan pengulangan informasi untuk mempertahankan atau memperkuat ingatan, bukan pemanggilan kembali informasi yang telah disimpan.","Metamemory: opsi ini menggambarkan kesadaran/pengetahuan mengenai strategi dan kemampuan memori, bukan pemanggilan kembali informasi yang telah disimpan."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Memori","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":77,"stem":"Salah satu konsep dalam filsafat ilmu adalah terkait prinsip bahwa kebenaran salah satunya diperoleh dari pengalaman-pengalaman misalnya penelitian dengan instrument panca indera. Apakah istilah untuk hal tersebut?","options":["Rationalism","Empiricism","Epistemology","Ontology","Axiology"],"answer":"Rationalism","explanation":"Rasionalisme menekankan daya nalar sebagai dasar memperoleh pengetahuan.","distractors":["Empiricism: opsi ini menggambarkan epistemologi yang menekankan pengalaman dan observasi inderawi, bukan epistemologi yang menekankan daya nalar.","Epistemology: opsi ini menggambarkan kajian tentang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan epistemologi yang menekankan daya nalar.","Ontology: opsi ini menggambarkan kajian tentang hakikat objek atau apa yang ada, bukan epistemologi yang menekankan daya nalar.","Axiology: opsi ini menggambarkan kajian tentang nilai dan kegunaan ilmu, bukan epistemologi yang menekankan daya nalar."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Philosophy of science","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian","2024"],"isCase":false},{"id":78,"stem":"Berikut ini benar terkait dengan gaya belajar","options":["Visual","Auditory","Kinesthetic","Analytical","Global"],"answer":"Visual","explanation":"Gaya visual lebih sesuai dengan dukungan berupa diagram, gambar, atau representasi visual.","distractors":["Auditory: opsi ini menggambarkan pemrosesan informasi melalui pendengaran dan pengulangan lisan, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Kinesthetic: opsi ini menggambarkan belajar melalui keterlibatan fisik dan praktik, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Analytical: opsi ini menggambarkan kecenderungan mengolah informasi secara bagian demi bagian, bukan pemrosesan informasi yang banyak dibantu gambar/diagram.","Global: opsi ini menggambarkan kecenderungan melihat informasi sebagai gambaran besar, bukan pemrosesan informasi yang banyak dibantu gambar/diagram."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Gaya belajar","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":79,"stem":"Seorang mahasiswa kedokteran sangat ingin untuk belajar dengan sungguh-sungguh karena ingin mendapatkan hadiah sebuah motor matuc bary. Termasuk ke dalam jenis motivasi apakah ini?","options":["Intrinsic motivation","Extrinsic motivation","Task value","Self-efficacy","Goal orientation"],"answer":"Extrinsic motivation","explanation":"Motivasi ekstrinsik dipicu faktor luar seperti hadiah atau hukuman.","distractors":["Intrinsic motivation: opsi ini menggambarkan dorongan yang berasal dari dalam diri, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Task value: opsi ini menggambarkan persepsi tentang pentingnya, menariknya, dan bergunanya materi/tugas, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Self-efficacy: opsi ini menggambarkan keyakinan bahwa diri mampu melakukan suatu tugas, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Goal orientation: opsi ini menggambarkan orientasi terhadap tujuan pencapaian dalam belajar, bukan dorongan karena faktor luar seperti hadiah atau hukuman."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Motivasi","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian","2024"],"isCase":false},{"id":80,"stem":"Seorang siswa menyukai instruksi tertulis disbanding instruksi verbal. Ia menyukai diagram untuk membantu mengingat. Ia memiliki kecenderungan mengamati seluruh elemen fisik dari lingkungan belajar. Ia berusaha memahami materi dengan membaca catatan dan membuat ringkasan. Apakah gaya belajar siswa tersebut?","options":["Visual","Auditory","Kinesthetic","Analytical","Global"],"answer":"Auditory","explanation":"Gaya auditori/aural lebih menekankan informasi yang didengar dan pengulangan secara lisan.","distractors":["Visual: opsi ini menggambarkan pemrosesan informasi yang banyak dibantu gambar/diagram, bukan pemrosesan informasi melalui pendengaran dan pengulangan lisan.","Kinesthetic: opsi ini menggambarkan belajar melalui keterlibatan fisik dan praktik, bukan pemrosesan informasi melalui pendengaran dan pengulangan lisan.","Analytical: opsi ini menggambarkan kecenderungan mengolah informasi secara bagian demi bagian, bukan pemrosesan informasi melalui pendengaran dan pengulangan lisan.","Global: opsi ini menggambarkan kecenderungan melihat informasi sebagai gambaran besar, bukan pemrosesan informasi melalui pendengaran dan pengulangan lisan."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Gaya belajar","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":81,"stem":"Seorang wanita berusia 56 tahun datang ke praktik dokter umum dengan keluhan badan terasa meriang. Pasien bersuku bangsa Jawa, berdomisili di daerah Kartasura. Dalam mengungkapkan apa yang dia rasakan dalam bahasa Jawa, pasien menyebut “gembrebeg”. Dokter yang bukan orang Jawa, menanyakan kepada pasien tentang maksud kata “gembrebeg” kepada pasien. Dengan memperhatikan komponen yang terlibat dalam komunikasi dokter, komponen apakah yang menjadi penghalang komunikasi, yang oleh dokter tersebut mencoba dihilangkan dengan mengklarifikasi arti “gembrebeg” kepada pasien? a.Context","options":["Noise","Coding","Decoding","Context","Feedback"],"answer":"Noise","explanation":"Noise adalah gangguan dalam proses komunikasi yang dapat membuat pesan tidak tersampaikan atau tidak dipahami sesuai maksudnya.","distractors":["Coding: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Decoding: opsi ini menggambarkan proses menafsirkan pesan oleh penerima, bukan gangguan dalam proses komunikasi.","Context: opsi ini menggambarkan situasi/lingkungan yang melingkupi komunikasi, bukan gangguan dalam proses komunikasi.","Feedback: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Communication","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":true},{"id":82,"stem":"Seorang mahasiswa kedokteran tertarik untuk mempelajari materi digestif karena dia mengerti kegunaan materi yang dipelajarinya untuk masa depannya. Manakah pilihan jawaban berikut ini yang mencerminkan pernyataan tersebut?","options":["Intrinsic motivation","Extrinsic motivation","Task value","Self-efficacy","Goal orientation"],"answer":"Extrinsic motivation","explanation":"Motivasi ekstrinsik dipicu faktor luar seperti hadiah atau hukuman.","distractors":["Intrinsic motivation: opsi ini menggambarkan dorongan yang berasal dari dalam diri, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Task value: opsi ini menggambarkan persepsi tentang pentingnya, menariknya, dan bergunanya materi/tugas, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Self-efficacy: opsi ini menggambarkan keyakinan bahwa diri mampu melakukan suatu tugas, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Goal orientation: opsi ini menggambarkan orientasi terhadap tujuan pencapaian dalam belajar, bukan dorongan karena faktor luar seperti hadiah atau hukuman."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Motivasi","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":83,"stem":"“Barangsiapa yang melakukan pengobatan dan dia tidak mengetahui ilmunya sebelum itu, maka dia (wajib) bertanggung jawab.” Kalimat ini adalah","options":["Hadis hasan","Pepatah Arab","Kalimat bijak Ibnu Qayyim","Kaidah hukum positif","Ungkapan Ali bin Abi Thalib"],"answer":"Hadis hasan","explanation":"Catatan sumber secara eksplisit menyebut pernyataan ini sebagai hadis hasan dan mencantumkan perawinya.","distractors":["Pepatah Arab: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Kalimat bijak Ibnu Qayyim: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Kaidah hukum positif: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Ungkapan Ali bin Abi Thalib: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Islamic studies • Hadith","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":84,"stem":"Terdapat beberapa fase dalam otak dalam menyimpan dan proses retensi memori. Salah satu fase tersebut yaitu pemanggilan lagi suatu informasi. Apakah istilah untuk hal tersebut?","options":["Retrieval","Acquisition","Consolidation","Rehearsal","Metamemory"],"answer":"Retrieval","explanation":"Retrieval adalah pemanggilan kembali informasi yang telah disimpan.","distractors":["Acquisition: opsi ini menggambarkan masuknya informasi ke sistem memori, bukan pemanggilan kembali informasi yang telah disimpan.","Consolidation: opsi ini menggambarkan mengintegrasikan informasi baru dengan pengetahuan yang sudah tersimpan, bukan pemanggilan kembali informasi yang telah disimpan.","Rehearsal: opsi ini menggambarkan pengulangan informasi untuk mempertahankan atau memperkuat ingatan, bukan pemanggilan kembali informasi yang telah disimpan.","Metamemory: opsi ini menggambarkan kesadaran/pengetahuan mengenai strategi dan kemampuan memori, bukan pemanggilan kembali informasi yang telah disimpan."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Memori","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":85,"stem":"Manakah karakteristik di bawah ini yang sesuai untuk pedagogy?","options":["Adult-centered, self-directed learning","Teacher-centered, dependent learning","Passive memorization","Child-centered pedagogy","Lecture-only learning"],"answer":"Adult-centered, self-directed learning","explanation":"Andragogi menekankan pembelajar dewasa sebagai individu yang lebih mandiri, berpengalaman, dan berorientasi pada masalah nyata.","distractors":["Teacher-centered, dependent learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Passive memorization: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Child-centered pedagogy: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Lecture-only learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertang em memori, bukan proses encoding, penyimpanan, dan pemanggilan kembali informasi.","Consolidation: opsi ini menggambarkan mengintegrasikan informasi baru dengan pengetahuan yang sudah tersimpan, bukan proses encoding, penyimpanan, dan pemanggilan kembali informasi.","Retrieval: opsi ini menggambarkan pemanggilan kembali informasi yang telah disimpan, bukan proses encoding, penyimpanan, dan pemanggilan kembali informasi.","Metacognition: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Memori","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":88,"stem":"Seorang dosen yang sedang mengajarkan tentang prinsip-prinsip keterampilan belajar menjelaskan pentingnya memiliki kemampuan : 1) reasoning, 2) evaluating, 3) problem solving), 4) decision making, dan 5) analyzing. Apakah istilah yang tepat yang dapat mencakup kelima hal tersebut?","options":["Critical appraisal","Critical thinking","Clinical expertise","Evidence based medicine","Epistemology"],"answer":"Critical appraisal","explanation":"Critical appraisal adalah penilaian sistematis terhadap validity, importance, dan applicability suatu bukti penelitian.","distractors":["Critical thinking: opsi ini menggambarkan kemampuan umum untuk menalar, menganalisis, mengevaluasi, dan memecahkan masalah, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Clinical expertise: opsi ini menggambarkan keahlian klinis yang diperoleh dari pengalaman dan pelatihan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Evidence based medicine: opsi ini menggambarkan penggabungan bukti terbaik, keahlian klinis, serta nilai dan preferensi pasien, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Epistemology: opsi ini menggambarkan kajian tentang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Critical appraisal","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":89,"stem":"G seorang guru yang mengantar muridnya, B anak laki-laki usia 9 tahun, ke Rumah Sakit karena kecelakaan saat pulang sekolah. Karena membutuhkan ada tindakan yang membutuhkan penandatanganan informed consent, maka bagaimana jika saudara adalah dokter yang menangani pasien B?","options":["Provide necessary emergency treatment first and obtain consent when the parent/guardian arrives","Wait for the parent even if delay risks life","Ask the teacher to act as the legal guardian","Ask the child to sign because the child is intelligent","Proceed without later seeking consent"],"answer":"Provide necessary emergency treatment first and obtain consent when the parent/guardian arrives","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Wait for the parent even if delay risks life: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Ask the teacher to act as the legal guardian: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Ask the child to sign because the child is intelligent: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Proceed without later seeking consent: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Clinical ethics • Informed consent","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":true},{"id":90,"stem":"Terdapat beberapa cara supaya suatu memori dapat masuk dari memori jangka pendek ke memori jangka panjang. Salah satu caranya yaitu dengan cara melakukan sesuatu yang diluar kelaziman memori dalam rangka membantu keberhasilan konsolidasi. Apakah nama hal tersebut?","options":["Metamemory","Consolidation","Rehearsal","Acquisition","Retrieval"],"answer":"Metamemory","explanation":"Metamemory adalah pengetahuan/kesadaran seseorang mengenai cara kerja dan strategi memorinya.","distractors":["Consolidation: opsi ini menggambarkan mengintegrasikan informasi baru dengan pengetahuan yang sudah tersimpan, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori.","Rehearsal: opsi ini menggambarkan pengulangan informasi untuk mempertahankan atau memperkuat ingatan, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori.","Acquisition: opsi ini menggambarkan masuknya informasi ke sistem memori, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori.","Retrieval: opsi ini menggambarkan pemanggilan kembali informasi yang telah disimpan, bukan kesadaran/pengetahuan mengenai strategi dan kemampuan memori."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Memori","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":91,"stem":"Seorang dokter ingin mengetahui apakah obat A dapat digunakan untuk terapi penyakit","options":["Problem or patient","Intervention","Comparison","Outcome","Study design"],"answer":"Problem or patient","explanation":"P pada PICO adalah problem/patient, yaitu masalah klinis atau populasi yang ingin dijawab.","distractors":["Intervention: opsi ini menggambarkan intervensi yang sedang dinilai, bukan masalah/pasien atau populasi dalam PICO.","Comparison: opsi ini menggambarkan pembanding seperti placebo atau terapi standar, bukan masalah/pasien atau populasi dalam PICO.","Outcome: opsi ini menggambarkan luaran yang diukur, bukan masalah/pasien atau populasi dalam PICO.","Study design: opsi ini menggambarkan rancangan penelitian, bukan masalah/pasien atau populasi dalam PICO."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • PICO","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":true},{"id":92,"stem":"Terdapat beberapa hal yang menyebabkan pembelajaran keterampilan klinik menjadi sulit. Salah satu dari hal tersebut yaitu situasi sebenarnya tidak mesti persis seperti yang diajarkan dosen. Apakah istilah untuk hal tersebut?","options":["Flexible","Intuitive","Automation","Reflective","Closed"],"answer":"Flexible","explanation":"Situasi klinik nyata dapat berbeda dari contoh latihan; karena itu keterampilan klinik membutuhkan fleksibilitas saat menerapkan pola yang dipelajari.","distractors":["Intuitive: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Automation: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Reflective: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Closed: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Clinical skills","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":93,"stem":"Seorang dokter melakukan pencarian jurnal dengan kata kunci sebagai berikut : “infantile colic” AND “lactobacillus reuteri” AND Placebo. Lactobacillus reuteri adalah probiotik sebagai salah satu terapi terhadap infantile colic. Placebo adalah substansi dengan sediaan obat namun tidak memiliki efek farmakologis. Apakah kategori kata kunci lactobacillus reuteri dalam strategi pencarian PICO?","options":["Problem or patient","Intervention","Comparison","Outcome","Study design"],"answer":"Comparison","explanation":"C pada PICO adalah pembanding, misalnya placebo atau terapi standar.","distractors":["Problem or patient: opsi ini menggambarkan masalah/pasien atau populasi dalam PICO, bukan pembanding seperti placebo atau terapi standar.","Intervention: opsi ini menggambarkan intervensi yang sedang dinilai, bukan pembanding seperti placebo atau terapi standar.","Outcome: opsi ini menggambarkan luaran yang diukur, bukan pembanding seperti placebo atau terapi standar.","Study design: opsi ini menggambarkan rancangan penelitian, bukan pembanding seperti placebo atau terapi standar."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • PICO","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian","2024"],"isCase":true},{"id":94,"stem":"Salah satu konsep penting dalam EBM yaitu terdapatnya peringkat-peringkat bukti yang didapatkan dari hasil pencarian. Manakah peringkat bukti tertinggi pada pilihan pilihan di bawah ini?","options":["Randomized controlled trial","Cohort study","Case-control study","Case series","Expert opinion"],"answer":"Randomized controlled trial","explanation":"RCT termasuk desain eksperimental dengan randomisasi sehingga kuat untuk menilai efek intervensi; di antara pilihan pada soal sumber, ini berada paling tinggi.","distractors":["Cohort study: opsi ini menggambarkan studi observasional yang mengikuti kelompok berdasarkan paparan, bukan uji intervensi dengan randomisasi.","Case-control study: opsi ini menggambarkan studi observasional yang membandingkan kelompok berdasarkan kejadian/outcome, bukan uji intervensi dengan randomisasi.","Case series: opsi ini menggambarkan deskripsi serangkaian kasus tanpa kelompok pembanding formal, bukan uji intervensi dengan randomisasi.","Expert opinion: opsi ini menggambarkan pendapat ahli tanpa dasar desain penelitian komparatif, bukan uji intervensi dengan randomisasi."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Level of evidence","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian","2024"],"isCase":false},{"id":95,"stem":"Berikut adalah dasar bagi seorang dokter muslim yang mukmin untuk melakukan praktik kedokteran dengan professional","options":["Al-Qur’an Surat An-Nisaa’ ayat 58","Al-Qur’an Surat Al-Ankabut ayat 4","Al-Qur’an Surat Al-Baqarah ayat 31","Al-Qur’an Surat Az-Zumar ayat 9","Al-Qur’an Surat Al-Baqarah ayat 247"],"answer":"Al-Qur’an Surat An-Nisaa’ ayat 58","explanation":"Di antara pilihan pada sumber, QS An-Nisaa’ 4:58 paling langsung terkait amanah dan penetapan dengan adil, yang digunakan sebagai dasar profesionalisme.","distractors":["Al-Qur’an Surat Al-Ankabut ayat 4: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Al-Qur’an Surat Al-Baqarah ayat 31: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Al-Qur’an Surat Az-Zumar ayat 9: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Al-Qur’an Surat Al-Baqarah ayat 247: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Islamic studies • Professionalism","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":true},{"id":96,"stem":"Seorang mahasiswa termotivasi untuk belajar karena dorongan orang tuanya. Karakteristik mahasiswa tersebut bersirikan sama dengan pernyataan di bawah ini a.Self-directing","options":["Intrinsic motivation","Extrinsic motivation","Task value","Self-efficacy","Goal orientation"],"answer":"Extrinsic motivation","explanation":"Motivasi ekstrinsik dipicu faktor luar seperti hadiah atau hukuman.","distractors":["Intrinsic motivation: opsi ini menggambarkan dorongan yang berasal dari dalam diri, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Task value: opsi ini menggambarkan persepsi tentang pentingnya, menariknya, dan bergunanya materi/tugas, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Self-efficacy: opsi ini menggambarkan keyakinan bahwa diri mampu melakukan suatu tugas, bukan dorongan karena faktor luar seperti hadiah atau hukuman.","Goal orientation: opsi ini menggambarkan orientasi terhadap tujuan pencapaian dalam belajar, bukan dorongan karena faktor luar seperti hadiah atau hukuman."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Motivasi","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":97,"stem":"Manakah pernyataan di bawah ini yang benar untuk seorang self directed learner","options":["Self-directed learning","Teacher-directed learning","Passive learning","Subject-based learning","Lecture-centered learning"],"answer":"Self-directed learning","explanation":"SDL menempatkan pelajar sebagai pihak yang aktif menetapkan tujuan, strategi, sumber belajar, dan evaluasi belajarnya.","distractors":["Teacher-directed learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Passive learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Subject-based learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Lecture-centered learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Self-directed learning","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":98,"stem":"Seorang pria 38 tahun datang ke praktik dokter umum dengan keluhan alat kelaminnya tidak dapat “berdiri” di pagi hari saat bangun tidur setelah mengonsumsi obat flu yang diberikan dokter sebelumnya. Pasien mengungkapkan keluhan tersebut dengan tertunduk malu serta diliputi kekhawaturan mengenai hal tersebut. Dalam komponen yang terlibat dalam komunikasi dokter-pasien, kekhawatiran yang dialami oleh pasien tersebut termasuk dalam komponen yang manakah?","options":["Sender","Receiver","Message","Channel","Context"],"answer":"Message","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Sender: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Receiver: opsi ini menggambarkan pihak yang menerima pesan, bukan Message.","Channel: opsi ini menggambarkan media/saluran komunikasi, bukan Message.","Context: opsi ini menggambarkan situasi/lingkungan yang melingkupi komunikasi, bukan Message."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Communication","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":true},{"id":99,"stem":"Seorang murid seharusnya berakhlak baik kepada semua gurunya. Mengapa seseorang harus berakhlak baik kepada guru?","options":["Situation","Sender","Receiver","Coding","Process"],"answer":"Situation","explanation":"Kekhawatiran internal pasien merupakan bagian dari situasi/konteks yang menyertai proses komunikasi, sesuai terminologi opsi sumber.","distractors":["Sender: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Receiver: opsi ini menggambarkan pihak yang menerima pesan, bukan keadaan/emosi yang menyertai komunikasi pasien.","Coding: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Process: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Communication","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":100,"stem":"Salah satu logika berpikir yaitu proses menarik kesimpulan individual dari umum. Apakah istilah untuk hal tersebut?","options":["Rationalism","Empiricism","Epistemology","Ontology","Axiology"],"answer":"Rationalism","explanation":"Rasionalisme menekankan daya nalar sebagai dasar memperoleh pengetahuan.","distractors":["Empiricism: opsi ini menggambarkan epistemologi yang menekankan pengalaman dan observasi inderawi, bukan epistemologi yang menekankan daya nalar.","Epistemology: opsi ini menggambarkan kajian tentang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan epistemologi yang menekankan daya nalar.","Ontology: opsi ini menggambarkan kajian tentang hakikat objek atau apa yang ada, bukan epistemologi yang menekankan daya nalar.","Axiology: opsi ini menggambarkan kajian tentang nilai dan kegunaan ilmu, bukan epistemologi yang menekankan daya nalar."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Philosophy of science","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":101,"stem":"Manakah pernyataan dibawah ini yang sesuai untuk self directed learning : 1. Proses seseorang mendapatkan inisiatif dengan bantuan orang lain dalam mediagnosa kebutuhan belajarnya 2. Proses seseorang mendapatkan inisiatif tanpa bantuan orang lain dalam memformulasikan tujuan belajarnya 3. Proses seseorang mendapatkan inisiatif untuk mengidentifikasi sumber belajarnya 4. Proses seseorang untuk memilih gaya belajarnya","options":["Self-directed learning","Teacher-directed learning","Passive learning","Subject-based learning","Lecture-centered learning"],"answer":"Self-directed learning","explanation":"SDL menempatkan pelajar sebagai pihak yang aktif menetapkan tujuan, strategi, sumber belajar, dan evaluasi belajarnya.","distractors":["Teacher-directed learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Passive learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Subject-based learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Lecture-centered learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Self-directed learning","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":102,"stem":"“Seorang murid selayaknya tidak mengemukaakan statemen orang lain yang kontras dengan statemen gurunya dengan maksud menentang pendapat gurunya” termasuk adab apakag pernyataan ini","options":["Humility before the teacher and recognition of the teacher’s greater knowledge","A student does not need a teacher","A student must demand every piece of knowledge","A student should contradict the teacher","A student should claim equal knowledge"],"answer":"Humility before the teacher and recognition of the teacher’s greater knowledge","explanation":"Kisah Musa–Khidir menggambarkan adab murid berupa kerendahan hati dan pengakuan atas keterbatasan pengetahuan diri.","distractors":["A student does not need a teacher: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student must demand every piece of knowledge: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student should contradict the teacher: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student should claim equal knowledge: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Islamic studies • Adab","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":103,"stem":"Seorang mahasiswa kedokteran sebaiknya dalam belajarnya menentukan cara pembelajarannya secara"," uman, bukan keyakinan bahwa diri mampu melakukan suatu tugas."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Motivasi","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":105,"stem":"Manakah pernyataan di bawah ini yang sesuai untuk problem based learning","options":["Problem-based, collaborative, and student-centered learning","Teacher-centered information transfer","Pure memorization","Single-discipline lecture only","Passive individual study"],"answer":"Problem-based, collaborative, and student-centered learning","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Teacher-centered information transfer: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Pure memorization: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Single-discipline lecture only: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Passive individual study: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • PBL","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":106,"stem":"Manakah yang termasuk salah satu asumsi andragogi?","options":["Adult-centered, self-directed learning","Teacher-centered, dependent learning","Passive memorization","Child-centered pedagogy","Lecture-only learning"],"answer":"Adult-centered, self-directed learning","explanation":"Andragogi menek m equal knowledge: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Islamic studies • Adab","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":108,"stem":"Salah satu aktivitas dalam critical appraisal adalah menilai apakah suatu artikel penelitian dapat digunakan dalam setting dokter terkait. Apakah istilah untuk hal tersebut?","options":["Critical appraisal","Critical thinking","Clinical expertise","Evidence based medicine","Epistemology"],"answer":"Critical appraisal","explanation":"Critical appraisal adalah penilaian sistematis terhadap validity, importance, dan applicability suatu bukti penelitian.","distractors":["Critical thinking: opsi ini menggambarkan kemampuan umum untuk menalar, menganalisis, mengevaluasi, dan memecahkan masalah, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Clinical expertise: opsi ini menggambarkan keahlian klinis yang diperoleh dari pengalaman dan pelatihan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Evidence based medicine: opsi ini menggambarkan penggabungan bukti terbaik, keahlian klinis, serta nilai dan preferensi pasien, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Epistemology: opsi ini menggambarkan kajian tentang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Critical appraisal","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":false},{"id":109,"stem":"Seorang dokter, saat menghadiri rapat RT, diminta untuk memberikan ceramah Kesehatan mengenai topik Kesehatan yang relevan dengan warga RT tersebut yang Sebagian besar berusia 40 tahun ke aras. Dalam menyampaikan ceramah, dokter berusaha memilih kata yang sederhana mungkin, dapat difahami oleh audiens, tetapi inti pesan kesehatan bisa sampai kepada audiens. Dokter tersebut melakukan upaya mengubah konsep medik rumit yang hanya difahami oleh komunitas ilmiah kedokteran menjadi bahasa yang sederhana. Dalam komponen komunikasi dokter-pasien, upaya yang dilakukan dokter tersebut termasuk dalam komponen yang mana?","options":["Sender","Receiver","Message","Channel","Context"],"answer":"Message","explanation":"Konsep ini merupakan jawaban yang paling sesuai dengan definisi atau struktur pertanyaan pada materi sumber.","distractors":["Sender: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Receiver: opsi ini menggambarkan pihak yang menerima pesan, bukan Message.","Channel: opsi ini menggambarkan media/saluran komunikasi, bukan Message.","Context: opsi ini menggambarkan situasi/lingkungan yang melingkupi komunikasi, bukan Message."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Communication","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":true},{"id":110,"stem":"Manakah pernyataan berikut ini yang sesuai untuk pengertian motivasi belajar?","options":["Intrinsic motivation","Extrinsic motivation","Task value","Self-efficacy","Goal orientation"],"answer":"Intrinsic motivation","explanation":"Motivasi intrinsik berasal dari dorongan dan ketertarikan dari dalam diri.","distractors":["Extrinsic motivation: opsi ini menggambarkan dorongan karena faktor luar seperti hadiah atau ateri sumber.","distractors":["Problem based learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Adult learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Critical appraisal: opsi ini menggambarkan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian, bukan penggabungan bukti terbaik, keahlian klinis, serta nilai dan preferensi pasien.","Competence: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian","2024"],"isCase":false},{"id":140,"stem":"Menurut Thomas Aquinas, argument logis untuk membuktikan adanya Tuhan adalah : Alam iini bergerak menuju sesuatu, padahal alam tidak tahu tujuan itu. Ada sesuatu Yang Mengatur alam menuju tujuan alam. Argument apakah ini?","options":["Teleological argument","Cosmological argument","Argument from motion","Ontological argument","Argument from degrees"],"answer":"Teleological argument","explanation":"Argumen teleologis berangkat dari keteraturan atau tujuan yang tampak pada alam sebagai dasar argumen tentang pengatur/pencipta.","distractors":["Cosmological argument: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Argument from motion: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Ontological argument: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Argument from degrees: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keput mu yang tidak diberikan-Nya kepada Khidir. manakah yang termasuk adab murid terhadap guru berdasarkan kisah Nabi Musa dengan Nabi Khidir?","options":["Menghargai rasionalitas pasien","Berupaya meningkatkan manfaat pasien","Mengobati pasien secara profesional","Memberi kesempatan yang sama kepada semua orang","Menghormati hak kelompok rentan"],"answer":"Menghargai rasionalitas pasien","explanation":"Menghargai rasionalitas dan pilihan pasien merupakan ekspresi penghormatan terhadap autonomy.","distractors":["Berupaya meningkatkan manfaat pasien: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Mengobati pasien secara profesional: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Memberi kesempatan yang sama kepada semua orang: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Menghormati hak kelompok rentan: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Clinical ethics","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["Ujian","2024"],"isCase":false},{"id":147,"stem":"Seorang dokter melakukan suatu kegiatan untuk menilai suatu jurnal apakah sahih, penting dan dapat diterapkan dalam praktek kliniknya. Apakah istilah yang tepat kegiatan yang dilakukan oleh dokter tersebut?","options":["Critical appraisal","Critical thinking","Clinical expertise","Evidence based medicine","Epistemology"],"answer":"Critical appraisal","explanation":"Critical appraisal adalah penilaian sistematis terhadap validity, importance, dan applicability suatu bukti penelitian.","distractors":["Critical thinking: opsi ini menggambarkan kemampuan umum untuk menalar, menganalisis, mengevaluasi, dan memecahkan masalah, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Clinical expertise: opsi ini menggambarkan keahlian klinis yang diperoleh dari pengalaman dan pelatihan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Evidence based medicine: opsi ini menggambarkan penggabungan bukti terbaik, keahlian klinis, serta nilai dan preferensi pasien, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Epistemology: opsi ini menggambarkan kajian tentang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Critical appraisal","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian","2024"],"isCase":true},{"id":148,"stem":"Seorang dosen sedang mengajarkan salah satu prinsip penting dalam praktek kedokteran. Ia menyampaikan bahwa seorang dokter semestinya menggunakan bukti terakhir terbaik yang ada secara jujur, teliti, jelas, dan bijaksana dalam mengambil keputusan untuk seorang pasien. Apakah istilah untuk hal tersebut?","options":["Critical appraisal","Critical thinking","Clinical expertise","Evidence based medicine","Epistemology"],"answer":"Critical appraisal","explanation":"Critical appraisal adalah penilaian sistematis terhadap validity, importance, dan applicability suatu bukti penelitian.","distractors":["Critical thinking: opsi ini menggambarkan kemampuan umum untuk menalar, menganalisis, mengevaluasi, dan memecahkan masalah, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Clinical expertise: opsi ini menggambarkan keahlian klinis yang diperoleh dari pengalaman dan pelatihan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Evidence based medicine: opsi ini menggambarkan penggabungan bukti terbaik, keahlian klinis, serta nilai dan preferensi pasien, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian.","Epistemology: opsi ini menggambarkan kajian tentang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan penilaian sistematis terhadap kualitas dan kegunaan artikel penelitian."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Critical appraisal","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["Ujian"],"isCase":true},{"id":149,"stem":"Apakah istilah tentang pengetahuan tentang cara belajar seorang anak-anak?","options":["Adult-centered, self-directed learning","Teacher-centered, dependent learning","Passive memorization","Child-centered pedagogy","Lecture-only learning"],"answer":"Adult-centered, self-directed learning","explanation":"Andragogi menekankan pembelajar dewasa sebagai individu yang lebih mandiri, berpengalaman, dan berorientasi pada masalah nyata.","distractors":["Teacher-centered, dependent learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Passive memorization: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Child-centered pedagogy: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Lecture-only learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Andragogi","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["U ang sumber, proses, syarat, batas, dan pembenaran pengetahuan, bukan ranah yang digunakan untuk pertanyaan Kant tentang harapan."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Philosophy • Immanuel Kant","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":false},{"id":211,"stem":"dokter akan menguji obat A, apakah obat A dapat menyembuhkan Penyakit/Obat B, lalu di bandingkan dengan obat","options":["Problem or patient","Intervention","Comparison","Outcome","Study design"],"answer":"Problem or patient","explanation":"P pada PICO adalah problem/patient, yaitu masalah klinis atau populasi yang ingin dijawab.","distractors":["Intervention: opsi ini menggambarkan intervensi yang sedang dinilai, bukan masalah/pasien atau populasi dalam PICO.","Comparison: opsi ini menggambarkan pembanding seperti placebo atau terapi standar, bukan masalah/pasien atau populasi dalam PICO.","Outcome: opsi ini menggambarkan luaran yang diukur, bukan masalah/pasien atau populasi dalam PICO.","Study design: opsi ini menggambarkan rancangan penelitian, bukan masalah/pasien atau populasi dalam PICO."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • PICO","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":false},{"id":212,"stem":"teori keterampilan, pemahaman, termasuk kedalam a lupa b humanis c kognitif d retrieval e behavioristik","options":["Memory","Acquisition","Consolidation","Retrieval","Metacognition"],"answer":"Memory","explanation":"Memori adalah proses mental untuk encoding, penyimpanan, dan pemanggilan kembali informasi.","distractors":["Acquisition: opsi ini menggambarkan masuk
