ognitive","explanation":"Ranah kognitif berkaitan dengan proses berpikir.","distractors":["Behavioristic: opsi ini menggambarkan pandangan belajar sebagai perubahan perilaku yang dapat diamati, bukan pandangan belajar sebagai proses mental.","Humanistic: opsi ini menggambarkan pandangan belajar yang menekankan manusia dan aktualisasi diri, bukan pandangan belajar sebagai proses mental.","Social learning: opsi ini menggambarkan belajar melalui interaksi/pengamatan sosial, bukan pandangan belajar sebagai proses mental.","Constructivist: opsi ini menggambarkan belajar melalui konstruksi pengetahuan oleh peserta didik, bukan pandangan belajar sebagai proses mental."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning theory","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":false},{"id":236,"stem":"Jenis manusia dalam kehidupan ini berdasarkan pengetahuannya","options":["A dan B","A dan C","A dan D","B dan C","C dan D"],"answer":"A dan B","explanation":"Klasifikasi pada sumber menilai A dan B sebagai kombinasi yang sadar terhadap apa yang diketahui dan tidak diketahui.","distractors":["A dan C: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A dan D: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","B dan C: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","C dan D: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Philosophy of science","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keisla ikasi dokter, komponen apakah yang menjadi penghalang komunikasi, yang oleh dokter tersebut mencoba dihilangkan dengan memberikan analogi yang lebih umum kepada pasien?","options":["Noise","Coding","Decoding","Context","Feedback"],"answer":"Noise","explanation":"Noise adalah gangguan dalam proses komunikasi yang dapat membuat pesan tidak tersampaikan atau tidak dipahami sesuai maksudnya.","distractors":["Coding: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Decoding: opsi ini menggambarkan proses menafsirkan pesan oleh penerima, bukan gangguan dalam proses komunikasi.","Context: opsi ini menggambarkan situasi/lingkungan yang melingkupi komunikasi, bukan gangguan dalam proses komunikasi.","Feedback: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Communication","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":true},{"id":241,"stem":"J yang merupakan pasien dari dokter A datang untuk berkonsultasi dengan saudara(saudara sebagai dokter yang membuka praktik mandiri). Pasien tersebut berkonsultasi karena sedang menderita penyakit amandel. Pasien tersebut mengeluhkan bahwa ia tidak kunjung sembuh saat berkonsultasi dengan dokter","options":["Automatic phase","Cognitive phase","Closed phase","Open phase","Reflective phase"],"answer":"Automatic phase","explanation":"Keterampilan intuitif menunjukkan fase automatic ketika tindakan semakin otomatis.","distractors":["Cognitive phase: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Closed phase: opsi ini menggambarkan fase latihan tugas rutin/sederhana dalam kondisi terkontrol, bukan fase ketika keterampilan dilakukan secara semakin otomatis/intuitif.","Open wab fokus pertanyaan pada stem.","Subject-based learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Lecture-centered learning: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Learning • Self-directed learning","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":false},{"id":247,"stem":"(Surat al kahfi ayat 66-70) Musa berkata kepada Khidhr: \"Bolehkah aku mengikutimu supaya kamu mengajarkan kepadaku ilmu yang benar di antara ilmu-ilmu yang telah diajarkan kepadamu?\" (66) Dia menjawab: \"Sesungguhnya kamu sekali-kali tidak akan sanggup sabar bersama aku.(67) Dan bagaimana kamu dapat sabar atas sesuatu, yang kamu belum mempunyai pengetahuan yang cukup tentang hal itu?\"(68) Musa berkata: \"Insya Allah kamu akan mendapati aku sebagai orang yang sabar, dan aku tidak akan menentangmu dalam sesuatu urusanpun\"(69) Dia berkata: \"Jika kamu mengikutiku, maka janganlah kamu menanyakan kepadaku tentang sesuatu apapun, sampai aku sendiri menerangkannya kepadamu\". (70) apakah arguensi yang dijelaskan oleh al qurtubi dari ayat tersebut","options":["Karena Musa belum memiliki pengetahuan yang cukup tentang hal-hal yang akan terjadi","Karena Khidhr merasa lebih tinggi derajatnya","Karena Musa selalu bertanya tanpa menunggu penjelasan","Karena Khidhr menolak mengajar Musa","Karena Musa tidak menghormati Khidhr"],"answer":"Karena Musa belum memiliki pengetahuan yang cukup tentang hal-hal yang akan terjadi","explanation":"Inti penjelasan dalam potongan ayat adalah keterbatasan pengetahuan Musa terhadap peristiwa yang belum ia pahami.","distractors":["Karena Khidhr merasa lebih tinggi derajatnya: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Karena Musa selalu bertanya tanpa menunggu penjelasan: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Karena Khidhr menolak mengajar Musa: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Karena Musa tidak menghormati Khidhr: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini menunjang kemampuan dokter umum dalam komunikasi, belajar, penalaran, atau pengambilan keputusan profesional sesuai konteks soal.","topic":"Islamic studies • Adab","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":false},{"id":248,"stem":"Ilmu dan adab adalah dua hal yang sangat penting dan saling melengkapi. Ada pemahaman yang telah dikemukakan oleh Abu Zakaria Al Anbari seorang ulama bahwa “ilmu tanpa adab” bagai…..","options":["Humility before the teacher and recognition of the teacher’s greater knowledge","A student does not need a teacher","A student must demand every piece of knowledge","A student should contradict the teacher","A student should claim equal knowledge"],"answer":"Humility before the teacher and recognition of the teacher’s greater knowledge","explanation":"Kisah Musa–Khidir menggambarkan adab murid berupa kerendahan hati dan pengakuan atas keterbatasan pengetahuan diri.","distractors":["A student does not need a teacher: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student must demand every piece of knowledge: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student should contradict the teacher: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","A student should claim equal knowledge: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada ste tidak menjawab fokus pertanyaan pada stem.","Closed phase: opsi ini menggambarkan fase latihan tugas rutin/sederhana dalam kondisi terkontrol, bukan fase ketika keterampilan dilakukan secara semakin otomatis/intuitif.","Open phase: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem.","Reflective phase: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"Clinical skills","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":false},{"id":280,"stem":"Apa yang dimaksud validity?","options":["Validity","Importance","Applicability","NNT","Absolute risk reduction"],"answer":"Validity","explanation":"Validity menilai apakah hasil penelitian sahih atau benar secara metodologis untuk menjawab pertanyaan penelitian.","distractors":["Importance: opsi ini menggambarkan kemaknaan atau besarnya dampak hasil penelitian, bukan kesahihan metodologis penelitian.","Applicability: opsi ini menggambarkan kemampuan menerapkan hasil penelitian pada pasien/konteks tertentu, bukan kesahihan metodologis penelitian.","NNT: opsi ini menggambarkan jumlah pasien yang perlu diterapi untuk memperoleh satu manfaat tambahan, bukan kesahihan metodologis penelitian.","Absolute risk reduction: opsi ini merujuk pada konsep yang berbeda dan tidak menjawab fokus pertanyaan pada stem."],"relevance":"Relevansi: konsep ini membantu dokter umum menilai masalah secara sistematis dan membuat keputusan yang dapat dipertanggungjawabkan.","topic":"EBM • Critical appraisal","skdi":"—","skdiNote":"Non-penyakit: learning skill, filsafat ilmu, komunikasi, etika, atau materi keislaman.","sources":["2024"],"isCase":false}];
const SKIPS=[{"index":29,"source":["Axon","Kumpulan1"],"reason":"Soal tidak cukup lengkap/ambigu untuk membentuk 5 opsi yang homogen tanpa menambah fakta yang tidak didukung sumber.","text":"29. Yang termasuk bagian dari efikasi diri adalah... A. Regulasi diri B. Nilai tugas C. Nilai ekstrinsik D. Tujuan... ( jawabannya ) E. Spiritual"},{"index":43,"source":["Axon","Kumpulan1"],"reason":"Soal tidak cukup lengkap/ambigu untuk membentuk 5 opsi yang homogen tanpa menambah fakta yang tidak didukung sumber.","text":"44. Disediakan tabel perawi hadist. Yaitu ada 8 perawi hadist. Hadist termasuk hadist yang sahih, dan termasuk ke dalam ? A. Dhoif B. Hasan C. - D. Muttawir E. ."},{"index":46,"source":["Axon","Kumpulan1"],"reason":"Soal tidak cukup lengkap/ambigu untuk membentuk 5 opsi yang homogen tanpa menambah fakta yang tidak didukung sumber.","text":"47. Langkah seven- jump tentang Ask question/presict answer pelajari pengertian dari setiap langkah"},{"index":110,"source":["Ujian"],"reason":"Soal tidak cukup lengkap/ambigu untuk membentuk 5 opsi yang homogen tanpa menambah fakta yang tidak didukung sumber.","text":"35. Seorang pelajar dapat mengingat informasi dalam belajarnya sebanyak 90% dari a. Apa yang dilihat b. Apa yang dilihat dan didengar c. Apa yang dikatakan dan dilakukan d. Apa yang didengar e. Apa yang dikatakan"},{"index":156,"source":["Ujian"],"reason":"Soal tidak cukup lengkap/ambigu untuk membentuk 5 opsi yang homogen tanpa menambah fakta yang tidak didukung sumber.","text":"86. Dalam suatu hadits disebutkan bahwa Rasulullah Shallallahu ‘alaihi wasallam bersabda, “Tidak termasuk umatku orang yang tidak menghotmati yang lebih tua,tidak mengasihi yang lebih muda dan tidak pula mengerti hak seorang yang alim.” Siapakah sahabat yang meriwayatkan hadits tersebut? a. Ustman bin Affan b. ‘Ubadah bin Ash Shamit c. Ali bin Abi Thalib d. Umar bin Khatthab e. Abu Bakar"}];

const TOPICS={"Logic":12,"Islamic studies • Epistemology":2,"Learning • Self-directed learning":17,"Professional competency":2,"EBM • Critical appraisal":14,"EBM • Level of evidence":7,"Islamic studies • Hadith":7,"Islamic studies • Qauliyah/Kauniyah":5,"Learning • Motivasi":19,"Learning • Gaya belajar":19,"Learning theory":9,"Dasar • Persepsi inderawi":1,"Learning • Andragogi":13,"Competency domains":7,"EBM • PICO":9,"Philosophy of science":21,"Learning • Memori":14,"EBM":7,"Learning • PBL":19,"Psychology • Maslow":1,"Philosophy • Thomas Aquinas":2,"Scientific method":2,"Psychology • Adulthood":1,"Scientific attitude":2,"Islamic history":1,"EBM • Effect size":1,"Learning • Traditional model":3,"Scientific thinking":2,"Clinical ethics • Informed consent":5,"Islamic studies • Adab":11,"Communication":18,"Clinical skills":5,"Islamic studies • Professionalism":1,"Learning concept":2,"Philosophy • Immanuel Kant":3,"Learning • Learning approach":1,"Clinical ethics":10,"Academic communication":2,"EBM • History":1,"Learning • Bloom taxonomy":2};
const TOTAL=DATA.length;
const KEY='ub-blok1-cbt-280-v1';
const FULL_TIME=180*60;
let state={order:[],optionOrders:{},answers:{},flags:{},current:0,remaining:FULL_TIME,running:false,finished:false,lastTick:0,lastSaved:Date.now(),randomQuestions:true};
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){state={...state,...s};if(!Array.isArray(state.order)||state.order.length!==TOTAL)state.order=[];const now=Date.now();if(state.running&&!state.finished&&state.lastSaved){state.remaining=Math.max(0,state.remaining-Math.floor((now-state.lastSaved)/1000));state.lastSaved=now;if(state.remaining<=0){state.running=false;state.finished=true}}}}catch(e){console.warn(e)} }
function save(){state.lastSaved=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}
function ensure(){if(!state.order.length){state.order=state.randomQuestions?shuffle([...Array(TOTAL).keys()]):[...Array(TOTAL).keys()]}
for(const q of DATA){if(!state.optionOrders[q.id])state.optionOrders[q.id]=shuffle([...Array(5).keys()])}
state.current=Math.min(Math.max(0,state.current),TOTAL-1);save()}
function currentQ(){return DATA[state.order[state.current]]}
function answeredCount(){return Object.keys(state.answers).length}
function letterFor(q,idx){return String.fromCharCode(65+state.optionOrders[q.id].indexOf(idx))}
function renderNav(){const box=$('numbers');box.innerHTML='';for(let pos=0;pos<TOTAL;pos++){const q=DATA[state.order[pos]],b=document.createElement('button');b.className='num'+(pos===state.current?' current':'')+(state.answers[q.id]!=null?' answered':'')+(state.flags[q.id]?' flagged':'');b.textContent=pos+1;b.onclick=()=>{state.current=pos;save();render()};box.appendChild(b)}$('navcount').textContent=`${answeredCount()}/${TOTAL}`}
function formatTime(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function tick(){if(!state.running||state.finished)return;const now=Date.now();const dt=Math.max(0,Math.floor((now-state.lastTick)/1000));if(dt>0){state.remaining=Math.max(0,state.remaining-dt);state.lastTick=now;save();renderTimer();if(state.remaining<=0){state.finished=true;state.running=false;save();finish()}}}
function renderTimer(){ $('timer').textContent=formatTime(state.remaining); $('timer').style.color=state.remaining<=300?'var(--danger)':'var(--text)'; }
function selectAnswer(q,optIdx){if(state.finished)return;state.answers[q.id]=q.options[optIdx];if(!state.running && state.current===0){state.running=true;state.lastTick=Date.now()}save();render()}
function render(){
 renderTimer();renderNav();const q=currentQ();const pos=state.current+1;const answered=state.answers[q.id]!=null;
 $('metaText').textContent=`Soal ${pos} / ${TOTAL} • ${q.topic}`;$('progressbar').style.width=(answeredCount()/TOTAL*100)+'%';
 const area=$('quizCard');area.innerHTML='';
 const tags=document.createElement('div');tags.className='tags';tags.innerHTML=`<span class="tag">${htmlEscape(q.topic)}</span>${q.isCase?'<span class="tag case">VIGNETTE / KASUS</span>':''}<span class="tag">SKDI: ${htmlEscape(q.skdi)}</span>`;area.appendChild(tags);
 const h=document.createElement('h2');h.className='question';h.textContent=q.stem;area.appendChild(h);
 const opts=document.createElement('div');
 state.optionOrders[q.id].forEach((origIdx)=>{const o=q.options[origIdx],b=document.createElement('button');const chosen=state.answers[q.id]===o;const isCorrect=o===q.answer;b.className='opt'+(answered?' disabled ':'')+(answered&&isCorrect?' correct':'')+(answered&&chosen&&!isCorrect?' wrong':'');b.disabled=answered;b.onclick=()=>selectAnswer(q,origIdx);b.innerHTML=`<div class="letter">${String.fromCharCode(65+state.optionOrders[q.id].indexOf(origIdx))}</div><div class="opttext">${htmlEscape(o)}</div>`;opts.appendChild(b)});
 area.appendChild(opts);
 if(answered){const d=document.createElement('div');d.className='discussion';d.innerHTML=`<div class="callout"><div><span class="key">Kunci: ${htmlEscape(q.answer)}</span></div><div style="margin-top:5px">${htmlEscape(q.explanation)}</div></div><h3>Pembahasan opsi</h3><div class="disc-grid">${q.distractors.map(x=>`<div class="why">${htmlEscape(x)}</div>`).join('')}<div class="relevance"><b>Relevansi:</b> ${htmlEscape(q.relevance)}<br><span style="color:var(--muted)">SKDI ${htmlEscape(q.skdi)} — ${htmlEscape(q.skdiNote)}</span></div></div></div>`;area.appendChild(d)}
 const nav=document.createElement('div');nav.className='navrow';nav.innerHTML=`<button class="btn" ${pos===1?'disabled':''} id="prevBtn">← Sebelumnya</button><button class="btn primary" id="nextBtn">${pos===TOTAL?'Selesai':'Berikutnya →'}</button>`;area.appendChild(nav);
 $('prevBtn').onclick=()=>{if(pos>1){state.current--;save();render()}};$('nextBtn').onclick=()=>{if(pos<TOTAL){state.current++;save();render()}else{finish()}};
 $('flagBtn').textContent=state.flags[q.id]?'⚑ Hapus tanda ragu':'⚑ Tandai ragu';$('flagBtn').onclick=()=>{state.flags[q.id]=!state.flags[q.id];save();render()};
 $('quizCard').style.display=state.finished?'none':'block';$('resultCard').classList.remove('show');
}
function finish(){state.finished=true;state.running=false;save();const score=DATA.filter(q=>state.answers[q.id]===q.answer).length;const pct=Math.round(score/TOTAL*100);const topics=Object.entries(TOPICS).sort((a,b)=>b[1]-a[1]);const r=$('resultCard');r.classList.add('show');r.innerHTML=`<h2 style="margin-top:0">Hasil CBT</h2><div class="summary-grid"><div class="stat"><b>${score}/${TOTAL}</b><span>skor benar</span></div><div class="stat"><b>${pct}%</b><span>persentase</span></div><div class="stat"><b>${answeredCount()}</b><span>dikerjakan</span></div><div class="stat"><b>${SKIPS.length}</b><span>di-skip dari sumber</span></div></div><div class="callout">Timer berakhir atau ujian diselesaikan. Semua pembahasan dibuka di bawah ini.</div><h3>Sebaran topik</h3><div class="topic-list">${topics.map(([k,v])=>`<div class="topic"><span>${htmlEscape(k)}</span><b>${v}</b></div>`).join('')}</div><h3 style="margin-top:18px">Catatan sumber & soal yang tidak dimasukkan</h3><div class="callout">Lima item tidak dimasukkan ke skor karena data sumber tidak cukup untuk membuat kunci yang aman tanpa menebak atau karena klaim/metainformasinya tidak dapat dipertahankan secara EBM.</div><ul class="skiplist">${SKIPS.map(x=>`<li><b>Sumber ${htmlEscape(x.source.join(', '))}</b>: ${htmlEscape(x.reason)}<br>${htmlEscape(x.text)}</li>`).join('')}</ul><h3 style="margin-top:18px">Lihat semua pembahasan</h3><div id="allDiscs"></div>`;
 const all=$('allDiscs');for(const q of DATA){const wrap=document.createElement('details');wrap.open=true;wrap.style.cssText='border:1px solid var(--line);border-radius:10px;margin:7px 0;padding:9px;background:#0f162a';wrap.innerHTML=`<summary><b>Soal ${q.id}</b> — ${htmlEscape(q.topic)} — <span class="key">${htmlEscape(q.answer)}</span></summary><p style="font-size:12px;line-height:1.5">${htmlEscape(q.explanation)}</p><div class="disc-grid">${q.distractors.map(x=>`<div class="why">${htmlEscape(x)}</div>`).join('')}</div><p style="font-size:11px;color:var(--muted)"><b>Relevansi:</b> ${htmlEscape(q.relevance)}<br>SKDI ${htmlEscape(q.skdi)} — ${htmlEscape(q.skdiNote)}</p></details>`;all.appendChild(wrap)}
 $('quizCard').style.display='none';$('metaText').textContent='Ujian selesai';$('progressbar').style.width='100%';window.scrollTo({top:0,behavior:'smooth'})
}
function htmlEscape(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('shuffleToggle').addEventListener('change',e=>{const currentId=currentQ().id;state.randomQuestions=e.target.checked;state.order=state.randomQuestions?shuffle([...Array(TOTAL).keys()]):[...Array(TOTAL).keys()];state.current=Math.max(0,state.order.findIndex(i=>DATA[i].id===currentId));save();render()});
$('resetBtn').onclick=()=>{if(confirm('Reset semua jawaban, flag, urutan, dan timer?')){localStorage.removeItem(KEY);location.reload()}};
load();ensure();$('shuffleToggle').checked=state.randomQuestions;if(state.finished)finish();else render();setInterval(tick,500);
</script></body></html>
